<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#151e2e" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-title { font-size: 22px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .header-sub { font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .step-title { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .step-desc { font-size: 13px; font-weight: 400; fill: #cbd5e1; }
    .code-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; }
    .badge-text { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .card-title { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .group-header { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
  </style>

  <!-- Canvas Background -->
  <rect width="900" height="740" rx="16" fill="url(#canvasGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header Title -->
  <g transform="translate(40, 26)">
    <text class="font-base header-title" x="0" y="20">LeaseLens System Architecture</text>
    <text class="font-base header-sub" x="0" y="38">End-to-End Privacy-First Multimodal Legal Intake &amp; Analysis Pipeline</text>
  </g>

  <!-- ==================== STEP 1: INGESTION ==================== -->
  <g transform="translate(130, 80)">
    <rect width="640" height="78" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.8" />
    <circle cx="38" cy="39" r="18" fill="#0369a1" fill-opacity="0.35" />
    <text x="38" y="45" font-size="18" text-anchor="middle">📄</text>
    
    <text class="font-base step-title" x="74" y="33">1. Multi-Format Ingestion Layer</text>
    <rect x="360" y="19" width="135" height="20" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <text class="font-base badge-text" x="427" y="33" fill="#38bdf8" text-anchor="middle">ZERO EXTERNAL API</text>

    <text class="font-base step-desc" x="74" y="56">Digital PDFs (<tspan class="code-tag">pdfplumber</tspan>) • Scans (<tspan class="code-tag">pypdfium2</tspan>) • Photos (<tspan class="code-tag">Pillow</tspan>) • DOCX • TXT</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="450" y1="158" x2="450" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ==================== STEP 2: SECURITY ==================== -->
  <g transform="translate(130, 194)">
    <rect width="640" height="78" rx="12" fill="url(#cardGrad)" stroke="#dc2626" stroke-width="1.8" />
    <circle cx="38" cy="39" r="18" fill="#991b1b" fill-opacity="0.35" />
    <text x="38" y="45" font-size="18" text-anchor="middle">🛡️</text>

    <text class="font-base step-title" x="74" y="33">2. Defense-in-Depth Privacy &amp; Security Guard</text>
    <rect x="450" y="19" width="150" height="20" rx="10" fill="#991b1b" fill-opacity="0.3" stroke="#dc2626" stroke-width="1" />
    <text class="font-base badge-text" x="525" y="33" fill="#f87171" text-anchor="middle">FERNET AES-128 ENCRYPT</text>

    <text class="font-base step-desc" x="74" y="56">Magic-Byte Sniffing • 8-Pattern PII Masking (SSN, DOB, Address, Bank) • 30-Day Auto-Purge</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="450" y1="272" x2="450" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ==================== STEP 3: RUBRIC ==================== -->
  <g transform="translate(130, 308)">
    <rect width="640" height="78" rx="12" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.8" />
    <circle cx="38" cy="39" r="18" fill="#065f46" fill-opacity="0.35" />
    <text x="38" y="45" font-size="18" text-anchor="middle">⚖️</text>

    <text class="font-base step-title" x="74" y="33">3. Deterministic Context &amp; Rubric Engine</text>
    <rect x="420" y="19" width="155" height="20" rx="10" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
    <text class="font-base badge-text" x="497" y="33" fill="#34d399" text-anchor="middle">JURISDICTION-AWARE</text>

    <text class="font-base step-desc" x="74" y="56">Classifier (Lease / Notice / Sublease) + State Overrides (CA 2-Mo Deposit, NY 1-Mo Limit)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="450" y1="386" x2="450" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ==================== STEP 4: HYBRID INTELLIGENCE ==================== -->
  <g transform="translate(130, 422)">
    <rect width="640" height="78" rx="12" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.8" />
    <circle cx="38" cy="39" r="18" fill="#92400e" fill-opacity="0.35" />
    <text x="38" y="45" font-size="18" text-anchor="middle">🧠</text>

    <text class="font-base step-title" x="74" y="33">4. Hybrid Intelligence &amp; Morphological RAG</text>
    <rect x="440" y="19" width="155" height="20" rx="10" fill="#92400e" fill-opacity="0.3" stroke="#d97706" stroke-width="1" />
    <text class="font-base badge-text" x="517" y="33" fill="#fbbf24" text-anchor="middle">CLAUDE VISION + MOCK</text>

    <text class="font-base step-desc" x="74" y="56">Claude 3.5 Sonnet Vision (Production) OR Deterministic MockProvider (Offline) + TF-Cosine RAG</text>
  </g>

  <!-- Split Branch Arrows 4 -> Containers -->
  <path d="M 330 500 L 330 522 L 245 522 L 245 540" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead-amber)" />
  <path d="M 570 500 L 570 522 L 655 522 L 655 540" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead-amber)" />

  <!-- ==================== STEP 5: DELIVERABLES CONTAINERS ==================== -->

  <!-- LEFT CONTAINER: Tenant Risk Assessment -->
  <g transform="translate(60, 542)">
    <!-- Container Box -->
    <rect width="370" height="166" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
    
    <!-- Top Header Badge -->
    <rect x="16" y="14" width="225" height="24" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2" />
    <text class="font-base group-header" x="26" y="30" fill="#ffffff">📊 TENANT RISK ASSESSMENT</text>

    <!-- Sub-card 1: Tenant Protection Score -->
    <g transform="translate(16, 48)">
      <rect width="338" height="48" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="1.5" />
      <text x="24" y="30" font-size="16" text-anchor="middle">🎯</text>
      <text class="font-base card-title" x="46" y="23">Tenant Protection Score (0–100)</text>
      <text class="font-base card-desc" x="46" y="38">Weighted Dial + 5 Category Health Breakdown</text>
    </g>

    <!-- Sub-card 2: Action Checklist -->
    <g transform="translate(16, 104)">
      <rect width="338" height="48" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
      <text x="24" y="30" font-size="16" text-anchor="middle">📋</text>
      <text class="font-base card-title" x="46" y="23">Prioritized Action Checklist</text>
      <text class="font-base card-desc" x="46" y="38">Ask Before Signing • Confirm in Writing</text>
    </g>
  </g>

  <!-- RIGHT CONTAINER: Legal Defense & Inquiries -->
  <g transform="translate(470, 542)">
    <!-- Container Box -->
    <rect width="370" height="166" rx="14" fill="#0f172a" stroke="#9333ea" stroke-width="2" />
    
    <!-- Top Header Badge -->
    <rect x="16" y="14" width="235" height="24" rx="6" fill="#581c87" stroke="#a855f7" stroke-width="1.2" />
    <text class="font-base group-header" x="26" y="30" fill="#ffffff">📁 LEGAL DEFENSE &amp; INQUIRIES</text>

    <!-- Sub-card 3: Legal Aid Brief -->
    <g transform="translate(16, 48)">
      <rect width="338" height="48" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="24" y="30" font-size="16" text-anchor="middle">📄</text>
      <text class="font-base card-title" x="46" y="23">Legal Aid Consultation Brief (.md)</text>
      <text class="font-base card-desc" x="46" y="38">Downloadable Clinic &amp; Attorney Intake Packet</text>
    </g>

    <!-- Sub-card 4: Grounded Q&A -->
    <g transform="translate(16, 104)">
      <rect width="338" height="48" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1.5" />
      <text x="24" y="30" font-size="16" text-anchor="middle">💬</text>
      <text class="font-base card-title" x="46" y="23">Grounded Q&amp;A Assistant</text>
      <text class="font-base card-desc" x="46" y="38">Document Excerpt Backed + Strict Anti-Hallucination</text>
    </g>
  </g>
</svg>
