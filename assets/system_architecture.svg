<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Markers for Arrows -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .desc { font-size: 13px; fill: #94a3b8; font-weight: 400; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #38bdf8; }
    .header-text { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .header-sub { font-size: 13px; fill: #64748b; }
  </style>

  <!-- Canvas Background with rounded corners -->
  <rect width="880" height="720" rx="16" fill="url(#canvasGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Header Title -->
  <g transform="translate(40, 24)">
    <text class="font-sans header-text" x="0" y="20">LeaseLens System Architecture</text>
    <text class="font-sans header-sub" x="0" y="38">End-to-End Privacy-First Multimodal Legal Intake &amp; Analysis Pipeline</text>
  </g>

  <!-- ==================== STEP 1: INGESTION ==================== -->
  <g transform="translate(140, 75)" filter="url(#cardShadow)">
    <rect width="600" height="76" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#0369a1" fill-opacity="0.3" />
    <text x="36" y="44" font-size="18" text-anchor="middle">📄</text>
    
    <text class="font-sans title" x="72" y="32">1. Multi-Format Ingestion Layer</text>
    <rect x="330" y="18" width="135" height="20" rx="10" fill="#0284c7" fill-opacity="0.2" />
    <text class="font-sans badge" x="397" y="32" fill="#38bdf8" text-anchor="middle">ZERO EXTERNAL API</text>

    <text class="font-sans desc" x="72" y="54">Digital PDFs (<tspan class="code">pdfplumber</tspan>), Scanned PDFs (<tspan class="code">pypdfium2</tspan>), Smartphone Photos (<tspan class="code">Pillow</tspan>), DOCX, TXT</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="440" y1="151" x2="440" y2="182" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ==================== STEP 2: SECURITY ==================== -->
  <g transform="translate(140, 184)" filter="url(#cardShadow)">
    <rect width="600" height="76" rx="12" fill="url(#cardGrad)" stroke="#dc2626" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#b91c1c" fill-opacity="0.3" />
    <text x="36" y="44" font-size="18" text-anchor="middle">🛡️</text>

    <text class="font-sans title" x="72" y="32">2. Defense-in-Depth Privacy &amp; Security Guard</text>
    <rect x="420" y="18" width="145" height="20" rx="10" fill="#dc2626" fill-opacity="0.2" />
    <text class="font-sans badge" x="492" y="32" fill="#f87171" text-anchor="middle">FERNET AES-128 ENCRYPT</text>

    <text class="font-sans desc" x="72" y="54">Magic-Byte Sniffing • 8-Pattern PII Redaction (SSN, DOB, Address, Card, Bank) • 30-Day Auto-Purge</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="260" x2="440" y2="291" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ==================== STEP 3: RUBRIC ==================== -->
  <g transform="translate(140, 293)" filter="url(#cardShadow)">
    <rect width="600" height="76" rx="12" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#047857" fill-opacity="0.3" />
    <text x="36" y="44" font-size="18" text-anchor="middle">⚖️</text>

    <text class="font-sans title" x="72" y="32">3. Deterministic Context &amp; Rubric Engine</text>
    <rect x="390" y="18" width="150" height="20" rx="10" fill="#059669" fill-opacity="0.2" />
    <text class="font-sans badge" x="465" y="32" fill="#34d399" text-anchor="middle">JURISDICTION-AWARE</text>

    <text class="font-sans desc" x="72" y="54">Document Classifier (Lease / Notice / Sublease) + State Statute Overrides (CA 2-Mo Deposit, NY 1-Mo)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="440" y1="369" x2="440" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ==================== STEP 4: HYBRID INTELLIGENCE ==================== -->
  <g transform="translate(140, 402)" filter="url(#cardShadow)">
    <rect width="600" height="76" rx="12" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#b45309" fill-opacity="0.3" />
    <text x="36" y="44" font-size="18" text-anchor="middle">🧠</text>

    <text class="font-sans title" x="72" y="32">4. Hybrid Intelligence &amp; Morphological RAG</text>
    <rect x="420" y="18" width="145" height="20" rx="10" fill="#d97706" fill-opacity="0.2" />
    <text class="font-sans badge" x="492" y="32" fill="#fbbf24" text-anchor="middle">CLAUDE VISION + MOCK</text>

    <text class="font-sans desc" x="72" y="54">Claude 3.5 Sonnet Vision (Production) OR Deterministic MockProvider (Offline) + TF-Cosine Legal RAG</text>
  </g>

  <!-- Split Arrows 4 -> Left & Right Output Boxes -->
  <path d="M 320 478 L 320 500 L 260 500 L 260 520" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead-amber)" />
  <path d="M 560 478 L 560 500 L 620 500 L 620 520" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead-amber)" />

  <!-- ==================== STEP 5: DELIVERABLES CONTAINER ==================== -->

  <!-- LEFT COLUMN: Tenant Risk Assessment -->
  <g transform="translate(60, 524)" filter="url(#cardShadow)">
    <rect width="365" height="166" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="200" height="22" rx="6" fill="#1e293b" />
    <text class="font-sans" x="24" y="29" font-size="12" font-weight="700" fill="#e2e8f0">📊 TENANT RISK ASSESSMENT</text>

    <!-- Sub-card 1: Tenant Protection Score -->
    <g transform="translate(16, 46)">
      <rect width="333" height="48" rx="8" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1" />
      <text x="24" y="30" font-size="16" text-anchor="middle">🎯</text>
      <text class="font-sans" x="46" y="23" font-size="13" font-weight="700" fill="#ffffff">Tenant Protection Score (0–100)</text>
      <text class="font-sans" x="46" y="38" font-size="11" fill="#94a3b8">Weighted Dial + 5 Category Health Breakdown</text>
    </g>

    <!-- Sub-card 2: Action Checklist -->
    <g transform="translate(16, 102)">
      <rect width="333" height="48" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="30" font-size="16" text-anchor="middle">📋</text>
      <text class="font-sans" x="46" y="23" font-size="13" font-weight="700" fill="#ffffff">Prioritized Action Checklist</text>
      <text class="font-sans" x="46" y="38" font-size="11" fill="#94a3b8">Ask Before Signing • Confirm in Writing</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Legal Defense & Inquiries -->
  <g transform="translate(455, 524)" filter="url(#cardShadow)">
    <rect width="365" height="166" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="220" height="22" rx="6" fill="#1e293b" />
    <text class="font-sans" x="24" y="29" font-size="12" font-weight="700" fill="#e2e8f0">📁 LEGAL DEFENSE &amp; INQUIRIES</text>

    <!-- Sub-card 3: Legal Aid Brief -->
    <g transform="translate(16, 46)">
      <rect width="333" height="48" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" />
      <text x="24" y="30" font-size="16" text-anchor="middle">📄</text>
      <text class="font-sans" x="46" y="23" font-size="13" font-weight="700" fill="#ffffff">Legal Aid Consultation Brief (.md)</text>
      <text class="font-sans" x="46" y="38" font-size="11" fill="#94a3b8">Downloadable Clinic &amp; Attorney Intake Packet</text>
    </g>

    <!-- Sub-card 4: Grounded Q&A -->
    <g transform="translate(16, 102)">
      <rect width="333" height="48" rx="8" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1" />
      <text x="24" y="30" font-size="16" text-anchor="middle">💬</text>
      <text class="font-sans" x="46" y="23" font-size="13" font-weight="700" fill="#ffffff">Grounded Q&amp;A Assistant</text>
      <text class="font-sans" x="46" y="38" font-size="11" fill="#94a3b8">Document Excerpt Backed + Strict Anti-Hallucination</text>
    </g>
  </g>
</svg>
